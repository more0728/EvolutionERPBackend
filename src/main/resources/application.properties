spring.application.name=EvolutionERP
spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=evo
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/evolution_erp}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgre}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=evo
spring.flyway.baselineOnMigrate=true
spring.flyway.baselineVersion=0
jwt.secret=${JWT_SECRET:NMVz2aolBAj5h1pBi9614WS2aBbG2kFiiK/iSZkzRi1mkfenvDzLKwR3YP9PzaeIFl0EDJOz1AtuCBjat2yMkw==}
# TODO(S2): rotar JWT_SECRET en prod — el valor en claro arriba es solo fallback dev. En prod inyectar env JWT_SECRET (Base64 ≥64 bytes HS512).
jwt.expiration=18000000
server.port=8085
spring.jackson.date-format=dd/MM/yyyy HH:mm:ss
spring.jackson.time-zone=America/Lima
